<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--navyH:#101A3D;--navy:#19254D;--lemon:#EEFF00;--map:#E6E9EF;--blue:#32A2FA}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{background:#20242E;padding:28px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:30px}
.row{width:440px;max-width:96vw;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:baseline;gap:9px;padding-left:2px}
.hd b{font-size:16px;font-weight:800;color:#fff}
.hd .rc{font-size:10px;font-weight:800;color:#16213F;background:#FFBA4C;padding:2px 8px;border-radius:20px}
.hd span{font-size:12.5px;color:#AEB4C2}
.dev{border-radius:18px;overflow:hidden;background:var(--navyH);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.frm{position:absolute;left:0;right:0;top:24px;bottom:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 0 1.5px rgba(255,168,37,.6),inset 0 0 22px rgba(255,166,50,.17)}
.sb{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;font-weight:600;color:#fff;opacity:.9;background:#000}
.ab{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--navyH)}
.mn{width:22px;height:2px;background:#E6E9EF;box-shadow:0 7px 0 #E6E9EF,0 -7px 0 #E6E9EF}
.chip{display:flex;align-items:center;gap:6px;background:var(--navy);border-radius:17px;padding:7px 13px;font-size:11px;font-weight:700;color:var(--lemon)}
.chip .cd{width:6px;height:6px;border-radius:50%;background:var(--lemon)}
.mapx{height:56px;background:var(--map);position:relative}
.mapx .rd{position:absolute;background:#fff;opacity:.9}
/* band */
.band{height:52px;display:flex;align-items:center;gap:11px;padding:0 10px 0 18px;position:relative;z-index:5;
  background:linear-gradient(180deg,#FFEBC8,#FFE0AC);box-shadow:0 2px 9px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45);border-bottom:1px solid rgba(200,140,40,.4)}
.spark{width:16px;height:16px;flex:none;fill:#E0902A}
.lbl{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.t1{font-size:16px;font-weight:700;color:#14203D;white-space:nowrap;letter-spacing:.1px}
.dot{width:4px;height:4px;border-radius:50%;flex:none;background:#D89A3A}
.t2{font-size:13.5px;font-weight:500;color:#8A7247;white-space:nowrap}
.stop{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:17px;font-size:14px;font-weight:700;white-space:nowrap}
.stop .xi{font-size:12px}
.v1 .stop{background:#FFA825;color:#3A2408;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.v2 .badge{display:flex;align-items:center;gap:6px;height:30px;padding:0 13px 0 11px;border-radius:15px;background:#FF9E1E;color:#2A1A05;font-size:15px;font-weight:800}
.v2 .badge .spark{fill:#2A1A05;width:15px;height:15px}
.v2 .stop{background:transparent;box-shadow:inset 0 0 0 1.4px rgba(20,32,61,.5);color:#14203D}
.v3 .stop{background:#14203D;color:#FFE6C0;height:36px;padding:0 18px}
</style></head><body>

<div class="row">
  <div class="hd"><b>V1 · 폴리시</b><span class="rc">추천</span><span>그라데이션 뎁스 · 솔리드 앰버 정지</span></div>
  <div class="dev">
    <div class="sb"><span>12:45</span><span>▲ ⛽ 100%</span></div>
    <div class="band v1"><div class="lbl"><svg class="spark" viewBox="0 0 24 24"><path d="M12 0C12 6.6 6.6 12 0 12 6.6 12 12 17.4 12 24 12 17.4 17.4 12 24 12 17.4 12 12 6.6 12 0Z"/></svg><span class="t1">연습 모드</span><span class="dot"></span><span class="t2">실제 운행 아님</span></div><div class="stop"><span class="xi">✕</span>중지</div></div>
    <div class="ab"><div class="mn"></div><div class="chip"><span class="cd"></span>미리배차 켜짐</div></div>
    <div class="mapx"><div class="rd" style="left:0;top:60%;width:100%;height:7%"></div><div class="rd" style="left:46%;top:0;width:5%;height:100%"></div></div>
    <div class="frm"></div>
  </div>
</div>

<div class="row">
  <div class="hd"><b>V2 · 뱃지형</b><span>연습 모드=솔리드 뱃지 · 아웃라인 정지</span></div>
  <div class="dev">
    <div class="sb"><span>12:45</span><span>▲ ⛽ 100%</span></div>
    <div class="band v2"><div class="lbl"><span class="badge"><svg class="spark" viewBox="0 0 24 24"><path d="M12 0C12 6.6 6.6 12 0 12 6.6 12 12 17.4 12 24 12 17.4 17.4 12 24 12 17.4 12 12 6.6 12 0Z"/></svg>연습 모드</span><span class="t2">실제 운행 아님</span></div><div class="stop"><span class="xi">✕</span>중지</div></div>
    <div class="ab"><div class="mn"></div><div class="chip"><span class="cd"></span>미리배차 켜짐</div></div>
    <div class="mapx"><div class="rd" style="left:0;top:60%;width:100%;height:7%"></div><div class="rd" style="left:46%;top:0;width:5%;height:100%"></div></div>
    <div class="frm"></div>
  </div>
</div>

<div class="row">
  <div class="hd"><b>V3 · 정지 강조</b><span>솔리드 네이비 정지 · 대비 최대</span></div>
  <div class="dev">
    <div class="sb"><span>12:45</span><span>▲ ⛽ 100%</span></div>
    <div class="band v3"><div class="lbl"><svg class="spark" viewBox="0 0 24 24"><path d="M12 0C12 6.6 6.6 12 0 12 6.6 12 12 17.4 12 24 12 17.4 17.4 12 24 12 17.4 12 12 6.6 12 0Z"/></svg><span class="t1">연습 모드</span><span class="dot"></span><span class="t2">실제 운행 아님</span></div><div class="stop"><span class="xi">✕</span>중지</div></div>
    <div class="ab"><div class="mn"></div><div class="chip"><span class="cd"></span>미리배차 켜짐</div></div>
    <div class="mapx"><div class="rd" style="left:0;top:60%;width:100%;height:7%"></div><div class="rd" style="left:46%;top:0;width:5%;height:100%"></div></div>
    <div class="frm"></div>
  </div>
</div>

</body></html>
